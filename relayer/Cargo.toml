[package]
name = "privacy-protocol-relayer"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.97"
async-trait = "0.1.89"
axum = { version = "0.8.1", features = ["macros", "json"] }
chrono = { version = "0.4.40", features = ["clock", "serde"] }
dotenvy = "0.15.7"
ethers = { version = "2.0.14", features = ["abigen", "rustls"] }
hex = "0.4.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tokio = { version = "1.44.1", features = ["macros", "rt-multi-thread", "signal", "time", "fs", "sync", "net"] }
tokio-util = "0.7.14"
tower-http = { version = "0.6.2", features = ["cors", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.16.0", features = ["serde", "v4"] }
